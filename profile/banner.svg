<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="ORVIL STUDIOS — Independent design and engineering studio">
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b65427"/>
      <stop offset="1" stop-color="#8a3c19"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- ivory paper -->
  <rect width="1280" height="360" fill="#f1ebe0"/>
  <rect width="1280" height="360" fill="#f1ebe0" filter="url(#grain)" opacity="0.65"/>

  <!-- top hairline -->
  <line x1="64" y1="56" x2="1216" y2="56" stroke="#14110d" stroke-opacity="0.14" stroke-width="1"/>

  <!-- top meta row -->
  <g font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="3.8" fill="#272018">
    <text x="64" y="44">INDEPENDENT STUDIO · EST. 2019</text>
    <text x="1216" y="44" text-anchor="end">INDIA · INTERNET</text>
  </g>

  <!-- glyph -->
  <g transform="translate(64, 110)">
    <circle cx="32" cy="32" r="32" fill="#14110d"/>
    <text x="32" y="44" text-anchor="middle" font-family="'Fraunces','Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="400" font-size="38" fill="#fbf6ec">o</text>
  </g>

  <!-- wordmark -->
  <g font-family="'Fraunces','Cormorant Garamond','Times New Roman', Georgia, serif" fill="#14110d">
    <text x="148" y="178" font-weight="400" font-size="120" letter-spacing="-5">ORVIL</text>
    <text x="500" y="178" font-style="italic" font-weight="400" font-size="120" letter-spacing="-5" fill="#8a3c19">Studios</text>
  </g>

  <!-- copper accent dot beside subtitle -->
  <circle cx="74" cy="252" r="5" fill="url(#copper)"/>

  <!-- subtitle -->
  <text x="94" y="258" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="4.2" fill="#272018">INDEPENDENT  DESIGN  ·  ENGINEERING  ·  MOTION</text>

  <!-- big tagline -->
  <text x="64" y="312" font-family="'Fraunces','Cormorant Garamond', Georgia, serif" font-weight="400" font-size="34" letter-spacing="-0.6" fill="#14110d">
    We build <tspan font-style="italic" fill="#8a3c19">enduring</tspan> digital experiences <tspan font-style="italic" fill="#0d5e4a">for the long arc.</tspan>
  </text>

  <!-- bottom hairline + status -->
  <line x1="64" y1="332" x2="1216" y2="332" stroke="#14110d" stroke-opacity="0.14" stroke-width="1"/>
  <g font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="3.6" fill="#272018">
    <circle cx="64" cy="350" r="4" fill="#3aaa6e"/>
    <text x="76" y="354">STUDIO OPEN  ·  TAKING WORK  ·  Q3 — Q4 2026</text>
    <text x="1216" y="354" text-anchor="end">ORVILSTUDIOS.COM</text>
  </g>
</svg>
